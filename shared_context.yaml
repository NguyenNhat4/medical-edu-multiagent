# Shared Context Initial State

# Configuration for Agents/Nodes
config:
  app:
    name: "Medical Content Assistant"
    version: "1.0.0"

  research:
    pubmed_base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/"
    tavily_api_key: ""  # Set via env var TAVILY_API_KEY
    max_search_results: 5

  rag:
    collection_name: "medical_docs"
    embedding_dim: 384  # all-MiniLM-L6-v2
    top_k: 5
    chunk_size: 512

  generation:
    model: "gemini-2.0-flash"
    temperature: 0.7

# Application State
chat_history:
  - role: "agent"
    content: "Xin chào! Tôi là Trợ lý Y khoa. Bạn cần soạn tài liệu về chủ đề gì?"

requirements: {}
blueprint: []
research_data: []
doc_sections: []
blueprint_with_queries: []
retrieved_documents: []
